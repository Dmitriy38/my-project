# Число активных каналов операторов для панели "Активные разговоры".
# Считаются каналы SIP/PJSIP/Local с добавочными вида 399xx (префикс 399 и длина
# номера, 5 цифр, зависят от нумерации конкретной АТС).
# Требует права sudo для пользователя zabbix на /usr/sbin/asterisk (см. README, шаг 5.2).
UserParameter=asterisk.calls.irkutsk,sudo /usr/sbin/asterisk -rx "core show channels" | grep -E "(SIP|PJSIP|Local)/399[0-9]{2}" | wc -l
