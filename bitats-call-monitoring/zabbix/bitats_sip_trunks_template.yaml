zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: 059e22071619451c97f077c4f5b27b3d
      name: Templates/Telephony
  templates:
    - uuid: 15dc2a2dc4844ee383657992e3942333
      template: 'BitATS SIP Trunks'
      name: 'BitATS SIP Trunks'
      groups:
        - name: Templates/Telephony
      discovery_rules:
        - uuid: 913a657a410d4dc3b53701d467bcdb11
          name: 'SIP Trunk Discovery'
          key: asterisk.trunk.discover
          delay: 5m
          item_prototypes:
            - uuid: 97eacbab4ce4416d9e2bb52a575af224
              name: 'Trunk {#TRUNK_USER} ({#TRUNK_HOST}) status'
              key: 'asterisk.trunk.status[{#TRUNK_USER}]'
              delay: 30s
              value_type: CHAR
              trends: '0'
              trigger_prototypes:
                - uuid: 19b9b7e4b00f4950834524c69713c816
                  expression: 'last(/BitATS SIP Trunks/asterisk.trunk.status[{#TRUNK_USER}])<>"Registered"'
                  name: 'Trunk {#TRUNK_USER} is not Registered ({#TRUNK_HOST})'
                  priority: HIGH
                  manual_close: 'YES'
