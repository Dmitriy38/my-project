                - uuid: 13ce82c1896b4315abc583257153c154
                  expression: |
                    ( count(/SMART by Zabbix agent 2 - Custom/smart.disk.es[{#NAME}],#2) = 1 and bitand(last(/SMART by Zabbix agent 2 - Custom/smart.disk.es[{#NAME}]),128) = 128 )
                    or ( bitand(last(/SMART by Zabbix agent 2 - Custom/smart.disk.es[{#NAME}]),128) = 128
