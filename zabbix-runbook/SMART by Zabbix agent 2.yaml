                - uuid: 0cfc67df3b7046f38c5d3c969882232c
                  expression: |
                    ( count(/SMART by Zabbix agent 2 - Custom/smart.disk.es[{#NAME}],#2) = 1 and bitand(last(/SMART by Zabbix agent 2 - Custom/smart.disk.es[{#NAME}]),32) = 32 )
                    or ( bitand(last(/SMART by Zabbix agent 2 - Custom/smart.disk.es[{#NAME}]),32) = 32
