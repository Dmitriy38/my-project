            - uuid: 5f7202a530b24eb1bc412069d02b2d93
              name: '[{#NAME}]: Exit status'
              type: DEPENDENT
              key: 'smart.disk.es[{#NAME}]'
              delay: '0'
              description: |
                The exit statuses of smartctl are defined by a bitmask but in decimal value. The eight different bits in the exit status have the following  meanings  for  ATA disks; some of these values may also be returned for SCSI disks.
                Bit 0: Command line did not parse.
                Bit 1: Device  open failed, device did not return an IDENTIFY DEVICE structure, or device is in a low-power mode (see '-n' option above).
                Bit 2: Some SMART or other ATA command to the disk failed, or there was a checksum error in a SMART data  structure  (see '-b' option above).
                Bit 3: SMART status check returned "DISK FAILING".
                Bit 4: We found prefail Attributes <= threshold.
                Bit 5: SMART  status  check returned "DISK OK" but we found that some (usage or prefail) Attributes have been <= threshold at some time in the past.
                Bit 6: The device error log contains records of errors.
                Bit 7: The device self-test log contains records of errors. [ATA only] Failed self-tests outdated by a newer successful extended self-test are ignored.
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.exit_status
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 6h
              master_item:
                key: 'smart.disk.get[{#PATH},"{#RAIDTYPE}"]'
              tags:
                - tag: component
                  value: storage
                - tag: diskname
                  value: '{#NAME}'
                - tag: disktype
                  value: '{#DISKTYPE}'
              trigger_prototypes:
                - uuid: d252d47d23ce4604bb4e187d79d038c6
                  expression: |
                    ( count(/SMART by Zabbix agent 2 - Custom/smart.disk.es[{#NAME}],#2) = 1 and bitand(last(/SMART by Zabbix agent 2 - Custom/smart.disk.es[{#NAME}]),8) = 8 )
                    or ( bitand(last(/SMART by Zabbix agent 2 - Custom/smart.disk.es[{#NAME}]),8) = 8
                    and bitand(last(/SMART by Zabbix agent 2 - Custom/smart.disk.es[{#NAME}]),8) > bitand(last(/SMART by Zabbix agent 2 - Custom/smart.disk.es[{#NAME}],#2),8) )
                  recovery_mode: NONE
                  name: 'SMART: [{#NAME}]: Check returned "DISK FAILING"'
                  priority: HIGH
                  description: 'SMART status check returned "DISK FAILING".'
                  manual_close: 'YES'
                  tags:
                    - tag: scope
                      value: notice
                - uuid: deba5dd27ade45b5ae7d888b0d26ff35
                  expression: |
                    ( count(/SMART by Zabbix agent 2 - Custom/smart.disk.es[{#NAME}],#2) = 1 and bitand(last(/SMART by Zabbix agent 2 - Custom/smart.disk.es[{#NAME}]),1) = 1 )
                    or ( bitand(last(/SMART by Zabbix agent 2 - Custom/smart.disk.es[{#NAME}]),1) = 1
                    and bitand(last(/SMART by Zabbix agent 2 - Custom/smart.disk.es[{#NAME}]),1) > bitand(last(/SMART by Zabbix agent 2 - Custom/smart.disk.es[{#NAME}],#2),1) )
                  recovery_mode: NONE
                  name: 'SMART: [{#NAME}]: Command line did not parse'
                  priority: HIGH
                  description: 'Command line did not parse.'
                  manual_close: 'YES'
                  tags:
                    - tag: scope
                      value: notice
                - uuid: aead8ad7f6af4c8e984c964b759c66e2
                  expression: |
                    ( count(/SMART by Zabbix agent 2 - Custom/smart.disk.es[{#NAME}],#2) = 1 and bitand(last(/SMART by Zabbix agent 2 - Custom/smart.disk.es[{#NAME}]),2) = 2 )
                    or ( bitand(last(/SMART by Zabbix agent 2 - Custom/smart.disk.es[{#NAME}]),2) = 2
                    and bitand(last(/SMART by Zabbix agent 2 - Custom/smart.disk.es[{#NAME}]),2) > bitand(last(/SMART by Zabbix agent 2 - Custom/smart.disk.es[{#NAME}],#2),2) )
                  recovery_mode: NONE
                  name: 'SMART: [{#NAME}]: Device open failed'
                  priority: HIGH
                  description: 'Device open failed, device did not return an IDENTIFY DEVICE structure, or device is in a low-power mode.'
                  manual_close: 'YES'
                  tags:
                    - tag: scope
                      value: notice
                - uuid: 785602b971914097849350d324a07847
                  expression: |
                    ( count(/SMART by Zabbix agent 2 - Custom/smart.disk.es[{#NAME}],#2) = 1 and bitand(last(/SMART by Zabbix agent 2 - Custom/smart.disk.es[{#NAME}]),64) = 64 )
                    or ( bitand(last(/SMART by Zabbix agent 2 - Custom/smart.disk.es[{#NAME}]),64) = 64
                    and bitand(last(/SMART by Zabbix agent 2 - Custom/smart.disk.es[{#NAME}]),64) > bitand(last(/SMART by Zabbix agent 2 - Custom/smart.disk.es[{#NAME}],#2),64) )
                  recovery_mode: NONE
                  name: 'SMART: [{#NAME}]: Error log contains records'
                  priority: HIGH
                  description: 'The device error log contains records of errors.'
                  manual_close: 'YES'
                  tags:
                    - tag: scope
