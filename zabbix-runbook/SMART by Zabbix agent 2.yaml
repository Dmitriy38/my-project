zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: e960332b3f6c46a1956486d4f3f99fce
      name: 'Templates/Server hardware'
  templates:
    - uuid: ddf68fb526f844b3a152b61ba88361a2
      template: 'SMART by Zabbix agent 2 - Custom'
      name: 'SMART by Zabbix agent 2 - Custom'
      description: |
        The template for monitoring S.M.A.R.T. attributes of physical disk that works without any external scripts. It collects metrics by Zabbix agent 2 version 5.0 and later with Smartmontools version 7.1 and later. Disk discovery LLD rule finds all HDD, SSD, NVMe disks with S.M.A.R.T. enabled. Attribute discovery LLD rule have pre-defined Vendor Specific Attributes for each disk, and will be discovered if attribute is present.
        
        Setup:
        
        1. Install Zabbix agent 2 and Smartmontools 7.1 or newer.
        
        2. Ensure the path to the "smartctl" executable is correctly specified. You can either provide the full path to the executable (e.g., "/usr/sbin/smartctl" on Linux or "C:\Program Files\smartctl\smartctl.exe" on Windows) in the configuration file or ensure that the folder containing the "smartctl" executable is added to the system's environment variables ("PATH"). This applies to both Linux and Windows systems.
        
        Example for Linux:      
        Plugins.Smart.Path=/usr/sbin/smartctl
        
        Example for Windows:
        Plugins.Smart.Path="C:\Program Files\smartctl\smartctl.exe"
        
        3. Grant Zabbix agent 2 super/admin user privileges for the "smartctl" utility (not required for Windows). Example for Linux (add the line that grants execution of the "smartctl" utility without the password):
        
        - Run the "visudo" command to edit the "sudoers" file:
        sudo visudo
        
        - Add the permission line and save the changes:
        zabbix ALL=(ALL) NOPASSWD:/usr/sbin/smartctl
        
        You can discuss this template or leave feedback on our forum https://www.zabbix.com/forum/zabbix-suggestions-and-feedback/415662-discussion-thread-for-official-zabbix-smart-disk-monitoring
        
        Generated by official Zabbix template tool "Templator"
      groups:
        - name: 'Templates/Server hardware'
      discovery_rules:
        - uuid: 10c9492121fc4c4a88d1345eb59c51f1
          name: 'Disk discovery'
          key: 'smart.disk.discovery[{$SMART.DISK.DISCOVERY.TYPE}]'
          delay: 1h
          filter:
            evaltype: AND
            conditions:
              - macro: '{#NAME}'
                value: '{$SMART.DISK.NAME.MATCHES}'
                formulaid: A
              - macro: '{#NAME}'
                value: '{$SMART.DISK.NAME.NOT_MATCHES}'
                operator: NOT_MATCHES_REGEX
                formulaid: B
          description: 'Discovery SMART disks.'
          item_prototypes:
            - uuid: c434f255335f43f3aa6fbf80583fb9f8
              name: 'SMART [{#NAME}]: Offline Uncorrectable RAW'
              type: DEPENDENT
              key: 'offline_uncorrectable_raw[{#NAME}]'
              delay: '0'
              history: 7d
              trends: '0'
              description: 'Количество секторов, которые диск не смог прочитать/скорректировать даже при офлайн-проверке. Значение больше 0 — уже подтверждённая физическая проблема с поверхностью диска, не предположение.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.offline_uncorrectable.raw
                  error_handler: DISCARD_VALUE
              master_item:
                key: 'smart.disk.get[{#PATH},"{#RAIDTYPE}"]'
              tags:
                - tag: component
                  value: smart
              trigger_prototypes:
                - uuid: 7a3399003f314d18b822840ba2179ace
                  expression: 'last(/SMART by Zabbix agent 2 - Custom/offline_uncorrectable_raw[{#NAME}])>0'
                  name: 'SMART [{#NAME}]: Обнаружены нечитаемые сектора (Offline Uncorrectable)'
                  priority: DISASTER
                  manual_close: 'YES'
                  tags:
                    - tag: target
                      value: '{#DISKTYPE}'
            - uuid: 76f1cfd531b64ce5a4f142bf085db5c9
              name: 'SMART [{#NAME}]: Pending Sectors RAW'
              type: DEPENDENT
              key: 'pending_sectors_raw[{#NAME}]'
              delay: '0'
              history: 7d
              trends: '0'
              description: 'Секторы-кандидаты на переназначение (диск подозревает их в нечитаемости, но ещё не убедился окончательно). Появление значения больше 0 — ранний тревожный признак, часто предшествует росту Reallocated Sectors.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.current_pending_sector.raw
                  error_handler: DISCARD_VALUE
              master_item:
                key: 'smart.disk.get[{#PATH},"{#RAIDTYPE}"]'
              tags:
                - tag: component
                  value: smart
              trigger_prototypes:
                - uuid: 55942faede9f4570beefa1faff4c5682
                  expression: 'last(/SMART by Zabbix agent 2 - Custom/pending_sectors_raw[{#NAME}])>0'
                  name: 'SMART [{#NAME}]: Есть сектора-кандидаты на переназначение'
                  priority: HIGH
                  manual_close: 'YES'
                  tags:
                    - tag: target
                      value: '{#DISKTYPE}'
            - uuid: a8efc2a40e194ec4bc8b7d137758f873
