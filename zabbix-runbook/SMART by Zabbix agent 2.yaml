                  value: raw
                - tag: component
                  value: storage
            - uuid: 1181c13abef244508f4a82f363098739
              name: '[{#NAME}]: Power on hours'
              type: DEPENDENT
              key: 'smart.disk.hours[{#NAME}]'
              delay: '0'
              description: |
                Count of hours in power-on state. The raw value of this attribute
                shows total count of hours (or minutes, or seconds, depending on manufacturer)
                in power-on state. "By default, the total expected lifetime of a hard disk
                in perfect condition is defined as 5 years (running every day and night on
                all days). This is equal to 1825 days in 24/7 mode or 43800 hours." On some
                pre-2005 drives, this raw value may advance erratically and/or "wrap around"
                (reset to zero periodically). https://en.wikipedia.org/wiki/S.M.A.R.T.#Known_ATA_S.M.A.R.T._attributes
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.power_on_time
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 6h
              master_item:
                key: 'smart.disk.get[{#PATH},"{#RAIDTYPE}"]'
              tags:
                - tag: component
                  value: storage
                - tag: diskname
                  value: '{#NAME}'
                - tag: disktype
                  value: '{#DISKTYPE}'
            - uuid: f424c7deb37a4f11a42432270619738d
              name: '[{#NAME}]: Media errors'
              type: DEPENDENT
              key: 'smart.disk.media_errors[{#NAME}]'
              delay: '0'
              description: |
                Contains the number of occurrences where the controller detected
                an unrecovered data integrity error. Errors such as uncorrectable ECC, CRC
                checksum failure, or LBA tag mismatch are included in this field.
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.media_errors
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 6h
              master_item:
                key: 'smart.disk.get[{#PATH},"{#RAIDTYPE}"]'
              tags:
                - tag: component
                  value: storage
                - tag: diskname
                  value: '{#NAME}'
                - tag: disktype
                  value: '{#DISKTYPE}'
            - uuid: b8d71f5a11324e4e848a4eceb096c141
              name: '[{#NAME}]: Device model'
              type: DEPENDENT
              key: 'smart.disk.model[{#NAME}]'
              delay: '0'
              value_type: CHAR
              trends: '0'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.model_name
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 6h
              master_item:
                key: 'smart.disk.get[{#PATH},"{#RAIDTYPE}"]'
              tags:
                - tag: component
                  value: inventory
                - tag: diskname
                  value: '{#NAME}'
                - tag: disktype
                  value: '{#DISKTYPE}'
            - uuid: 8c1a5f379a784002ad2c9b8d210e0333
              name: '[{#NAME}]: Percentage used'
              type: DEPENDENT
              key: 'smart.disk.percentage_used[{#NAME}]'
              delay: '0'
              units: '%'
              description: |
                Contains a vendor specific estimate of the percentage of NVM subsystem
                life used based on the actual usage and the manufacturer's prediction of NVM
                life. A value of 100 indicates that the estimated endurance of the NVM in
                the NVM subsystem has been consumed, but may not indicate an NVM subsystem
                failure. The value is allowed to exceed 100. Percentages greater than 254
                shall be represented as 255. This value shall be updated once per power-on
                hour (when the controller is not in a sleep state).
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.percentage_used
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 6h
              master_item:
                key: 'smart.disk.get[{#PATH},"{#RAIDTYPE}"]'
              tags:
                - tag: component
                  value: smart
                - tag: component
                  value: storage
                - tag: diskname
                  value: '{#NAME}'
                - tag: disktype
                  value: '{#DISKTYPE}'
              trigger_prototypes:
                - uuid: d20edbc2d7184e579e9b67ef2293f9dc
                  expression: 'last(/SMART by Zabbix agent 2 - Custom/smart.disk.percentage_used[{#NAME}])>30'
                  name: 'SMART: [{#NAME}]: NVMe disk percentage using is over 30% of estimated endurance'
                  priority: WARNING
                  manual_close: 'YES'
                  tags:
                    - tag: scope
                      value: notice
                - uuid: 0dc8022942ca47d396387b4098be41cc
                  expression: 'last(/SMART by Zabbix agent 2 - Custom/smart.disk.percentage_used[{#NAME}])>80'
                  name: 'SMART: [{#NAME}]: NVMe disk percentage using is over 80% of estimated endurance'
                  priority: AVERAGE
                  manual_close: 'YES'
                  tags:
                    - tag: scope
                      value: notice
            - uuid: 2fc0d37c793641f48a8894b13cfed1ac
              name: '[{#NAME}]: Serial number'
              type: DEPENDENT
              key: 'smart.disk.sn[{#NAME}]'
              delay: '0'
              value_type: CHAR
              trends: '0'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.serial_number
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 6h
              master_item:
                key: 'smart.disk.get[{#PATH},"{#RAIDTYPE}"]'
              tags:
                - tag: component
                  value: inventory
                - tag: diskname
                  value: '{#NAME}'
                - tag: disktype
                  value: '{#DISKTYPE}'
              trigger_prototypes:
                - uuid: d88f251bc7a3408292660d95d3f6220f
                  expression: 'last(/SMART by Zabbix agent 2 - Custom/smart.disk.sn[{#NAME}],#1)<>last(/SMART by Zabbix agent 2 - Custom/smart.disk.sn[{#NAME}],#2) and length(last(/SMART by Zabbix agent 2 - Custom/smart.disk.sn[{#NAME}]))>0'
                  name: 'SMART: [{#NAME}]: Disk has been replaced'
                  event_name: 'SMART: [{#NAME}]: Disk has been replaced (new serial number received)'
                  priority: INFO
                  description: 'Device serial number has changed. Acknowledge to close the problem manually.'
                  manual_close: 'YES'
                  tags:
                    - tag: scope
                      value: notice
            - uuid: c4077819d01e4e6ea81739caf7f2d11a
              name: '[{#NAME}]: Temperature'
              type: DEPENDENT
              key: 'smart.disk.temperature[{#NAME}]'
              delay: '0'
              history: 7d
              trends: '0'
              units: °C
              description: 'Current drive temperature.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.temperature
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 6h
              master_item:
                key: 'smart.disk.get[{#PATH},"{#RAIDTYPE}"]'
              tags:
                - tag: component
                  value: temperature
                - tag: diskname
                  value: '{#NAME}'
                - tag: disktype
                  value: '{#DISKTYPE}'
              trigger_prototypes:
                - uuid: 603c821616d540d39a5b2e773a56d262
                  expression: 'avg(/SMART by Zabbix agent 2 - Custom/smart.disk.temperature[{#NAME}],5m)>{$SMART.TEMPERATURE.MAX.CRIT}'
                  name: 'SMART: [{#NAME}]: Average disk temperature is critical'
                  event_name: 'SMART: [{#NAME}]: Average disk temperature is critical (over {$SMART.TEMPERATURE.MAX.CRIT}°C for 5m)'
                  priority: AVERAGE
                  manual_close: 'YES'
                  tags:
                    - tag: scope
                      value: notice
                - uuid: 0d79b60ef07240cc90e46207121df576
                  expression: 'avg(/SMART by Zabbix agent 2 - Custom/smart.disk.temperature[{#NAME}],5m)>{$SMART.TEMPERATURE.MAX.WARN:"{#DISKTYPE}"}'
                  name: 'SMART: [{#NAME}]: Average disk temperature is too high'
                  event_name: 'SMART: [{#NAME}]: Average disk temperature is too high (over {$SMART.TEMPERATURE.MAX.WARN}°C for 5m)'
                  priority: WARNING
                  manual_close: 'YES'
                  dependencies:
                    - name: 'SMART: [{#NAME}]: Average disk temperature is critical'
                      expression: 'avg(/SMART by Zabbix agent 2 - Custom/smart.disk.temperature[{#NAME}],5m)>{$SMART.TEMPERATURE.MAX.CRIT}'
                  tags:
                    - tag: scope
                      value: notice
            - uuid: f347460ad9694964869e5b4d7d1bf81a
              name: '[{#NAME}]: Self-test in progress'
              type: DEPENDENT
              key: 'smart.disk.test.progress[{#NAME}]'
              delay: '0'
              description: 'Reports if disk currently is executing SMART self-test.'
              valuemap:
                name: 'Smart self-test'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.self_test_in_progress
                - type: JAVASCRIPT
                  parameters:
                    - |
                      const idx = {
                      	'true': 1,
                      	'false': 2,
                      	'null': 3,
                      };
                      
                      return typeof idx[value] === 'undefined' ? 0 : idx[value];
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 6h
              master_item:
                key: 'smart.disk.get[{#PATH},"{#RAIDTYPE}"]'
              tags:
                - tag: component
                  value: health
                - tag: diskname
                  value: '{#NAME}'
                - tag: disktype
                  value: '{#DISKTYPE}'
            - uuid: b93f830dfa5a4b639545c27bc5acbe79
              name: '[{#NAME}]: Self-test passed'
              type: DEPENDENT
              key: 'smart.disk.test[{#NAME}]'
              delay: '0'
              description: 'The disk is passed the SMART self-test or not.'
              valuemap:
                name: 'Smart self-test'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.self_test_passed
                - type: JAVASCRIPT
                  parameters:
                    - |
                      const idx = {
                      	'true': 1,
                      	'false': 2,
                      	'null': 3,
                      };
                      
                      return typeof idx[value] === 'undefined' ? 0 : idx[value];
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 6h
              master_item:
                key: 'smart.disk.get[{#PATH},"{#RAIDTYPE}"]'
              tags:
                - tag: component
                  value: health
                - tag: diskname
                  value: '{#NAME}'
                - tag: disktype
                  value: '{#DISKTYPE}'
            - uuid: a66a5526758741589b6d981372f8c964
              name: 'SMART [{#NAME}]: SSD Life Left'
              type: DEPENDENT
              key: 'ssd_life_left[{#NAME}]'
              delay: '0'
              history: 7d
              trends: '0'
              description: |
                Оставшийся ресурс SSD/NVMe накопителя в процентах (100% = новый диск, 0% = ресурс исчерпан).
                
                Источник значения зависит от типа диска:
                - SATA SSD: атрибут SMART "SSD Life Left" (ID A9/E9 у разных производителей)
                - SATA SSD (некоторые Kingston): "Remaining Lifetime %"
                - NVMe: 100% минус "Percentage Used"
                
                Диски без ни одного из этих полей (обычные HDD) значение не получают — это нормально, метрика относится только к твердотельным накопителям.
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var data = JSON.parse(value);
                      var diskType = (data.disk_type || '').toLowerCase();
                      
                      if (diskType === 'ssd') {
                          if (data.ssd_life_left && data.ssd_life_left.normalized_value !== undefined) {
                              return data.ssd_life_left.normalized_value;
                          }
                          if (data.remaining_lifetime_perc && data.remaining_lifetime_perc.normalized_value !== undefined) {
                              return data.remaining_lifetime_perc.normalized_value;
                          }
                          return null;
                      }
                      
                      if (diskType === 'nvme') {
                          if (data.percentage_used !== undefined) {
                              return 100 - data.percentage_used;
                          }
                          return null;
                      }
                      
                      return null; // hdd и всё прочее — метрика физически не относится к таким дискам
              master_item:
                key: 'smart.disk.get[{#PATH},"{#RAIDTYPE}"]'
              tags:
                - tag: component
                  value: smart
              trigger_prototypes:
                - uuid: 780acd49aaa24b2082883a88f5a523e2
                  expression: 'last(/SMART by Zabbix agent 2 - Custom/ssd_life_left[{#NAME}])<71'
                  name: 'SMART [{#NAME}]: SSD ресурс ниже 70% (осталось {ITEM.LASTVALUE}%)'
                  opdata: 'ресурс ниже 70% (осталось {ITEM.LASTVALUE}%)'
                  priority: WARNING
                  manual_close: 'YES'
                  tags:
                    - tag: target
                      value: '{#DISKTYPE}'
            - uuid: 50052c2227a54a55997f08e5a8788e93
              name: 'SMART [{#NAME}]: Wear Leveling Normalized'
              type: DEPENDENT
              key: 'wear_leveling_normalized[{#NAME}]'
              delay: '0'
              history: 7d
              trends: '0'
              description: 'Индикатор износа по циклам стирания NAND-памяти (SMART атрибут AD/E7 в зависимости от производителя). Есть не у всех моделей SSD — часть контроллеров это поле в принципе не публикует.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.wear_leveling_count.normalized_value
                  error_handler: DISCARD_VALUE
              master_item:
                key: 'smart.disk.get[{#PATH},"{#RAIDTYPE}"]'
              tags:
                - tag: component
                  value: smart
          trigger_prototypes:
            - uuid: 5a369c1f454a43949555effc14d6e2bf
              expression: 'last(/SMART by Zabbix agent 2 - Custom/smart.disk.test[{#NAME}])=2 and last(/SMART by Zabbix agent 2 - Custom/smart.disk.test.progress[{#NAME}])=2'
              name: 'SMART: [{#NAME}]: Disk self-test is not passed'
              opdata: 'Result: {ITEM.LASTVALUE1}, test in progress: {ITEM.LASTVALUE2}'
              priority: HIGH
              manual_close: 'YES'
              tags:
                - tag: scope
                  value: notice
          overrides:
            - name: Self-test
              step: '1'
              filter:
                conditions:
                  - macro: '{#DISKTYPE}'
                    value: nvme
                    formulaid: A
              operations:
                - operationobject: ITEM_PROTOTYPE
                  operator: LIKE
                  value: Self-test
                  discover: NO_DISCOVER
            - name: 'Not NVMe'
              step: '2'
              filter:
                conditions:
                  - macro: '{#DISKTYPE}'
                    value: nvme
                    operator: NOT_MATCHES_REGEX
                    formulaid: A
              operations:
                - operationobject: ITEM_PROTOTYPE
                  operator: REGEXP
                  value: Media|Percentage|Critical
                  discover: NO_DISCOVER
            - name: Raw_Read_Error_Rate
              step: '3'
              filter:
                conditions:
                  - macro: '{#ATTRIBUTES}'
                    value: Raw_Read_Error_Rate
                    formulaid: A
              operations:
                - operationobject: ITEM_PROTOTYPE
                  operator: REGEXP
                  value: Raw_Read_Error_Rate
                  discover: DISCOVER
            - name: Spin_Up_Time
              step: '4'
              filter:
                conditions:
                  - macro: '{#ATTRIBUTES}'
                    value: Spin_Up_Time
                    formulaid: A
              operations:
                - operationobject: ITEM_PROTOTYPE
                  operator: REGEXP
                  value: Spin_Up_Time
                  discover: DISCOVER
            - name: Start_Stop_Count
              step: '5'
              filter:
                conditions:
                  - macro: '{#ATTRIBUTES}'
                    value: Start_Stop_Count
                    formulaid: A
              operations:
                - operationobject: ITEM_PROTOTYPE
                  operator: REGEXP
                  value: Start_Stop_Count
                  discover: DISCOVER
            - name: Power_Cycle_Count
              step: '6'
              filter:
                conditions:
                  - macro: '{#ATTRIBUTES}'
                    value: Power_Cycle_Count
                    formulaid: A
              operations:
                - operationobject: ITEM_PROTOTYPE
                  operator: REGEXP
                  value: Power_Cycle_Count
                  discover: DISCOVER
            - name: Reported_Uncorrect
              step: '7'
              filter:
                conditions:
                  - macro: '{#ATTRIBUTES}'
                    value: Reported_Uncorrect
                    formulaid: A
              operations:
                - operationobject: ITEM_PROTOTYPE
                  operator: REGEXP
                  value: Reported_Uncorrect
                  discover: DISCOVER
            - name: Seek_Error_Rate
              step: '8'
              filter:
                conditions:
                  - macro: '{#ATTRIBUTES}'
                    value: Seek_Error_Rate
                    formulaid: A
              operations:
                - operationobject: ITEM_PROTOTYPE
                  operator: REGEXP
                  value: Seek_Error_Rate
                  discover: DISCOVER
            - name: Bad_Block_Rate
              step: '9'
              filter:
                conditions:
                  - macro: '{#ATTRIBUTES}'
                    value: Bad_Block_Rate
                    formulaid: A
              operations:
                - operationobject: ITEM_PROTOTYPE
                  operator: REGEXP
                  value: Bad_Block_Rate
                  discover: DISCOVER
            - name: Program_Fail_Count_Chip
              step: '10'
              filter:
                conditions:
                  - macro: '{#ATTRIBUTES}'
                    value: Program_Fail_Count_Chip
                    formulaid: A
              operations:
                - operationobject: ITEM_PROTOTYPE
                  operator: REGEXP
                  value: Program_Fail_Count_Chip
                  discover: DISCOVER
            - name: Reallocated_Sector_Ct
              step: '11'
              filter:
                conditions:
                  - macro: '{#ATTRIBUTES}'
                    value: Reallocated_Sector_Ct
                    formulaid: A
              operations:
                - operationobject: ITEM_PROTOTYPE
                  operator: REGEXP
                  value: Reallocated_Sector_Ct
                  discover: DISCOVER
      tags:
        - tag: class
          value: storage
      macros:
        - macro: '{$SMART.DISK.DISCOVERY.TYPE}'
          value: name
          description: 'This macro is responsible for changing how SMART disks get discovered. Only "name" or "id" values allowed.'
        - macro: '{$SMART.DISK.NAME.MATCHES}'
          value: '^.*$'
          description: 'This macro is used in the filter of attribute and disk discoveries. It can be overridden on the host or linked on the template level.'
        - macro: '{$SMART.DISK.NAME.NOT_MATCHES}'
          value: CHANGE_IF_NEEDED
          description: 'This macro is used in the filter of attribute and disk discoveries. It can be overridden on the host or linked on the template level.'
        - macro: '{$SMART.TEMPERATURE.MAX.CRIT}'
          value: '65'
          description: 'This macro is used for trigger expression. It can be overridden on the host or linked on the template level.'
        - macro: '{$SMART.TEMPERATURE.MAX.CRIT:"hdd"}'
          value: '62'
        - macro: '{$SMART.TEMPERATURE.MAX.CRIT:"nvme"}'
          value: '80'
        - macro: '{$SMART.TEMPERATURE.MAX.CRIT:"ssd"}'
          value: '70'
        - macro: '{$SMART.TEMPERATURE.MAX.WARN}'
          value: '56'
          description: 'This macro is used for trigger expression. It can be overridden on the host or linked on the template level.'
        - macro: '{$SMART.TEMPERATURE.MAX.WARN:"hdd"}'
          value: '56'
        - macro: '{$SMART.TEMPERATURE.MAX.WARN:"nvme"}'
          value: '70'
        - macro: '{$SMART.TEMPERATURE.MAX.WARN:"ssd"}'
          value: '60'
      dashboards:
        - uuid: 0755c7e31385419dba807a9c4a2ff4ae
          name: 'SMART: Overview'
          pages:
            - name: Temperature
              widgets:
                - type: graphprototype
                  width: '72'
                  height: '20'
                  fields:
                    - type: ITEM_PROTOTYPE
                      name: itemid.0
                      value:
                        host: 'SMART by Zabbix agent 2 - Custom'
                        key: 'smart.disk.temperature[{#NAME}]'
                    - type: STRING
                      name: reference
                      value: AAAAA
                    - type: INTEGER
                      name: rows
                      value: '5'
                    - type: INTEGER
                      name: source_type
                      value: '3'
            - name: 'Power On'
              widgets:
                - type: graphprototype
                  width: '72'
                  height: '20'
                  fields:
                    - type: ITEM_PROTOTYPE
                      name: itemid.0
                      value:
                        host: 'SMART by Zabbix agent 2 - Custom'
                        key: 'smart.disk.hours[{#NAME}]'
                    - type: STRING
                      name: reference
                      value: AAAAB
                    - type: INTEGER
                      name: rows
                      value: '5'
                    - type: INTEGER
                      name: source_type
                      value: '3'
      valuemaps:
        - uuid: f5f726288e8c4d18aa30c5217443031e
          name: 'Smart self-test'
          mappings:
            - value: '0'
              newvalue: Undefined
            - value: '1'
              newvalue: 'True'
            - value: '2'
              newvalue: 'False'
            - value: '3'
              newvalue: 'Null'
