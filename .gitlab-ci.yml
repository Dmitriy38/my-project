  - build 
  - test2
  - stage
  - autoobnova
  - prod


install_env:
  stage : test 
  script: 
  - echo " test 1 -------------------"

run_tests:
  stage : test 
  script: 
  - echo " test 2 -------------------"

linters::
  stage : test 
  script: 
  - echo " test linter ---------"

build: 
    stage: build
    script:
    - echo 'running ./build.sh'

test_after_build:
  stage : test2
  script: 
  - echo " test after build 1 -------------------"

deploy website:
  stage : stage 
  script: 
    - cp -rf ./html.* /var/www/html
  #when: manual
  tags:
    - stage-shell
  only: 
      refs: 
        - tags 
        - master
        - /^release.*$/

auto_refresh:
  stage: autoobnova
  script:
    - echo '<script>setTimeout(()=>location.reload(),30000)</script>' >> /var/www/html/index.html
  only:
    - master
  tags:
    - stage-shell

deploy prod:
    stage: prod 
    script: 
    - echo 'running ./build.sh'
    #when: manual
    only: 
      refs: 
        - tags 
        - master 